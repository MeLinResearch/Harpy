# HARPY v3 study specification: DRAFT. Not frozen. `harpy study` refuses to run
# it while `status` is anything but `frozen`.
#
# Before freezing:
#   1. Settle the owner decisions in docs/STUDY_V3_DESIGN.md (relay handling,
#      review policy, operating point, August branch).
#   2. Fill in primary_cell and the pricing file it implies.
#   3. Run `harpy feasibility` on that cell with `--study` pointing here. Freeze
#      only on a FREEZABLE verdict, at the seed count it recommends or more.
#   4. Set status: frozen and commit before collecting any outcome.
#
# The world, thresholds, detector assumptions and decision criteria below are
# v2's, unchanged. Changing them to make a cell pass is out of bounds.
schema: harpy/study/2
status: draft
study_id: harpy-v3-draft
v2_study_id: harpy-v2-cost-sensitivity-2026-10-10
simulation_config: configs/v3.yaml
pricing: null  # one of configs/pricing.v3.*.yaml, per decision 3
grid:
  seeds: [0, 199]  # placeholder; replace with the feasibility recommendation
  arms: [TIER0_ONLY, RANDOM, HYBRID, EXPOSURE]
  severities: [SUBTLE]
  budget_pcts: [0.05]
  lineage_fidelities: [1.0]
  reserve_fractions: [0.5]
  fleet_scales: [100.0]
  review_scalings: [fixed, linear]
  alert_caps: [0.05]
  worker_models: null  # per decision 3
  followup_audits: [0, 4]
decision:
  minimum_seeds: 30
  minimum_incremental_detection: 0.10
  maximum_overhead: 0.10
  bootstrap_samples: 2000
primary_cell: null  # per decisions 1-3; see docs/STUDY_V3_DESIGN.md
