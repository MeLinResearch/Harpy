name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

      - name: published evidence matches its recorded source
        shell: bash
        run: |
          uv run harpy verify --manifest evidence/study-v2/manifest.json
          uv run harpy verify --manifest evidence/replay-reference/manifest.json
          uv run python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          from harpy.provenance import source_identity
          recorded = json.loads(Path("evidence/study-v2/inputs.json").read_text())
          build = json.loads(Path("evidence/study-v2/build.json").read_text())
          revision = build["analysis_source_revision"]
          assert re.fullmatch(r"[0-9a-f]{40}", revision), "expected immutable study revision"
          for path, expected in recorded["provenance"]["source"]["files_sha256"].items():
              original = subprocess.check_output(["git", "show", f"{revision}:{path}"])
              assert hashlib.sha256(original).hexdigest() == expected, f"study source mismatch: {path}"
          replay = json.loads(Path("evidence/replay-reference/report.json").read_text())
          assert replay["source"] == source_identity(), "replay source differs from checkout"
          PY

      - name: observable-only replay and evidence verification
        run: |
          uv run harpy replay --corpus examples/replay/synthetic --out replay-smoke/
          uv run harpy verify --manifest replay-smoke/manifest.json

      - name: sweep refuses placeholder pricing
        shell: bash
        run: |
          # Must exit nonzero: configs/pricing.yaml ships unverified on purpose.
          if uv run harpy sweep --config configs/default.yaml --seeds 0..0 --out /tmp/harpy-gate; then
            echo "sweep accepted placeholder pricing" >&2
            exit 1
          fi

      - name: smoke run and plot
        shell: bash
        run: |
          # All arms and severities, both review policies, and endpoint values
          # for budgets/fidelity/reserves/scales/caps: 144 simulations, 576 records.
          uv run harpy run --config configs/default.yaml \
            --pricing configs/pricing.smoke.yaml \
            --seed 0 --allow-unverified-pricing --out smoke-run/
          uv run python scripts/ci_smoke.py \
            --out smoke-results/
          uv run harpy plot --results smoke-results/ --review-scaling fixed \
            --out smoke-results/detection_vs_overhead.png
          uv run harpy plot --results smoke-results/ --review-scaling linear \
            --out smoke-results/linear/detection_vs_overhead.png
          uv run harpy verify --manifest smoke-run/manifest.json
          uv run harpy verify --manifest smoke-results/manifest.json

